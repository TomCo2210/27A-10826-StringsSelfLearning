# פריסת הלומדה ל-GitHub Pages
# הפרקים האופציונליים נקבעים מה-Secrets של הריפו (Settings → Secrets and variables → Actions):
#   INCLUDE_STRTOK, INCLUDE_CTYPE, INCLUDE_SPRINTF_SSCANF, INCLUDE_PRACTICE  =  true / false
# אפשר להגדיר אותם גם כ-Variables (באותו מסך, בלשונית Variables). Secret גובר על Variable.
# שינוי של Secret לא מריץ את הפריסה לבד: אחרי השינוי, Actions → Deploy to GitHub Pages → Run workflow.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site with chapter flags
        env:
          INCLUDE_STRTOK: ${{ secrets.INCLUDE_STRTOK || vars.INCLUDE_STRTOK }}
          INCLUDE_CTYPE: ${{ secrets.INCLUDE_CTYPE || vars.INCLUDE_CTYPE }}
          INCLUDE_SPRINTF_SSCANF: ${{ secrets.INCLUDE_SPRINTF_SSCANF || vars.INCLUDE_SPRINTF_SSCANF }}
          INCLUDE_PRACTICE: ${{ secrets.INCLUDE_PRACTICE || vars.INCLUDE_PRACTICE }}
        run: node scripts/apply-flags.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
